[project]
name = "agency-os"
version = "0.1.0"
description = "Autonomous AI Agency Operating System - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.4",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "anthropic==1.12.1",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "pyyaml==6.0.3",
    "email-validator>=2.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
